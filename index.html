<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wildlife Ecology Master Prep (Weeks 1 - 12)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="flex items-center space-x-3 w-full sm:w-auto justify-between sm:justify-start">
        <div class="flex items-center space-x-2">
          <div class="p-2 bg-emerald-500 rounded-lg text-slate-900 font-bold text-lg">
            <i class="fa-solid fa-leaf"></i>
          </div>
          <div>
            <h1 class="text-base sm:text-lg font-bold tracking-tight text-emerald-400">Wildlife Ecology</h1>
            <p class="text-[11px] text-slate-400">Weeks 1 – 12 (120 Qs)</p>
          </div>
        </div>
      </div>

      <!-- Controls -->
      <div class="flex items-center gap-2 w-full sm:w-auto justify-between">
        <select id="weekFilter" class="bg-slate-700 border border-slate-600 rounded-lg px-2.5 py-1.5 text-xs sm:text-sm font-medium text-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 flex-1 sm:flex-initial">
          <option value="all">All Weeks (1-12)</option>
          <option value="1">Week 1: Fundamentals</option>
          <option value="2">Week 2: Biodiversity</option>
          <option value="3">Week 3: Behavior & Interactions</option>
          <option value="4">Week 4: Energetics & Food Chains</option>
          <option value="5">Week 5: Population Dynamics</option>
          <option value="6">Week 6: Community Ecology</option>
          <option value="7">Week 7: Biogeography</option>
          <option value="8">Week 8: Habitat Loss & HIPPO</option>
          <option value="9">Week 9: Anthropocene</option>
          <option value="10">Week 10: Ecotoxicology</option>
          <option value="11">Week 11: Harvesting & MSY</option>
          <option value="12">Week 12: Applied Ecology</option>
        </select>

        <div class="inline-flex rounded-lg bg-slate-700 p-1 shrink-0">
          <button id="btnFlashcards" class="px-2.5 py-1 text-xs font-semibold rounded-md bg-emerald-500 text-slate-900 transition">Cards</button>
          <button id="btnQuiz" class="px-2.5 py-1 text-xs font-semibold rounded-md text-slate-300 hover:text-white transition">Quiz</button>
          <button id="btnBrowse" class="px-2.5 py-1 text-xs font-semibold rounded-md text-slate-300 hover:text-white transition">Browse</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-3 sm:p-6 flex flex-col justify-center">

    <!-- Flashcard Mode View -->
    <div id="flashcardView" class="w-full flex flex-col items-center">
      <div class="w-full flex justify-between items-center mb-2 px-1 text-xs text-slate-400">
        <span id="fcCardCount">Card 1 of 120</span>
        <span id="fcTag" class="px-2 py-0.5 rounded-full bg-slate-800 border border-slate-700 text-emerald-400 font-medium">Week 1</span>
        <button id="fcShuffle" class="hover:text-emerald-400 transition"><i class="fa-solid fa-shuffle mr-1"></i> Shuffle</button>
      </div>

      <!-- Card Container (Self-adjusting height for mobile) -->
      <div class="w-full perspective-1000 cursor-pointer min-h-[380px] sm:min-h-[460px] flex" id="flipCard">
        <div id="cardInner" class="relative w-full transform-style-3d transition-transform duration-500 rounded-2xl shadow-xl flex">
          
          <!-- Front Side -->
          <div class="w-full backface-hidden bg-slate-800 border-2 border-slate-700 rounded-2xl p-4 sm:p-6 flex flex-col justify-between hover:border-emerald-500/50 transition">
            <div>
              <div class="flex items-center justify-between text-[11px] sm:text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                <span id="fcWeekText">Week 1</span>
                <span>Question <i class="fa-regular fa-circle-question ml-1 text-emerald-400"></i></span>
              </div>
              <p id="fcQuestion" class="text-sm sm:text-base font-semibold text-slate-100 mb-3 leading-snug"></p>
            </div>

            <!-- Options List on Front -->
            <div id="fcOptionsList" class="grid grid-cols-1 gap-1.5 my-auto max-h-[220px] overflow-y-auto pr-1"></div>

            <div class="text-center text-[11px] sm:text-xs text-slate-500 font-medium mt-3 pt-2 border-t border-slate-700/60">
              <i class="fa-solid fa-rotate mr-1"></i> Tap anywhere to flip
            </div>
          </div>

          <!-- Back Side -->
          <div class="absolute inset-0 w-full h-full backface-hidden rotate-y-180 bg-slate-800 border-2 border-emerald-500/60 rounded-2xl p-4 sm:p-6 flex flex-col justify-between">
            <div class="flex items-center justify-between text-[11px] sm:text-xs font-bold uppercase tracking-wider text-emerald-400">
              <span>Correct Answer</span>
              <span><i class="fa-solid fa-circle-check text-emerald-400"></i></span>
            </div>

            <div class="my-auto text-center px-2 py-4">
              <span class="text-[10px] sm:text-xs uppercase tracking-widest text-slate-400 font-semibold mb-2 block">Answer</span>
              <h3 id="fcAnswer" class="text-lg sm:text-2xl font-bold text-emerald-400 mb-3 leading-normal"></h3>
              <p id="fcCategory" class="text-xs text-slate-400 bg-slate-900/60 inline-block px-3 py-1 rounded-lg border border-slate-700"></p>
            </div>

            <div class="text-center text-[11px] sm:text-xs text-slate-500 font-medium pt-2 border-t border-slate-700/60">
              <i class="fa-solid fa-rotate mr-1"></i> Tap to flip back
            </div>
          </div>

        </div>
      </div>

      <!-- Navigation Controls (Optimized touch targets) -->
      <div class="grid grid-cols-3 gap-2 w-full max-w-sm mt-4">
        <button id="btnPrev" class="py-2.5 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-200 border border-slate-700 rounded-xl transition flex items-center justify-center gap-1 font-medium text-xs sm:text-sm">
          <i class="fa-solid fa-arrow-left"></i> Prev
        </button>
        <button id="btnFlip" class="py-2.5 bg-emerald-500 hover:bg-emerald-400 active:bg-emerald-600 text-slate-900 font-bold rounded-xl transition shadow-md shadow-emerald-500/20 text-xs sm:text-sm">
          Flip
        </button>
        <button id="btnNext" class="py-2.5 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-200 border border-slate-700 rounded-xl transition flex items-center justify-center gap-1 font-medium text-xs sm:text-sm">
          Next <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>
    </div>

    <!-- Quiz Mode View -->
    <div id="quizView" class="hidden w-full max-w-2xl mx-auto bg-slate-800 p-4 sm:p-6 rounded-2xl border border-slate-700 shadow-xl">
      <div class="flex justify-between items-center mb-3 text-xs font-semibold text-slate-400">
        <span id="quizProgress">Question 1 of 10</span>
        <span id="quizScoreText" class="text-emerald-400 font-bold">Score: 0 / 0</span>
      </div>
      <div class="w-full bg-slate-700 h-1.5 rounded-full mb-4 overflow-hidden">
        <div id="quizProgressBar" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
      </div>

      <h2 id="quizQuestion" class="text-sm sm:text-base font-semibold mb-4 text-slate-100 min-h-[2.5rem]"></h2>

      <div id="quizOptions" class="grid grid-cols-1 gap-2 mb-4"></div>

      <div class="flex justify-between items-center pt-3 border-t border-slate-700">
        <div id="quizFeedback" class="text-xs sm:text-sm font-semibold"></div>
        <button id="quizNextBtn" class="hidden px-4 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-bold rounded-xl transition text-xs sm:text-sm ml-auto">
          Next <i class="fa-solid fa-chevron-right ml-1"></i>
        </button>
      </div>
    </div>

    <!-- All Q&A Browse View -->
    <div id="browseView" class="hidden w-full flex flex-col gap-3">
      <input type="text" id="searchInput" placeholder="Search questions, answers, or keywords..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-xs sm:text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500">
      <div id="browseList" class="flex flex-col gap-2.5"></div>
    </div>

  </main>

  <script>

      { week: 8, num: 6, q: "A small population moving toward extinction due to Allee effects and demographic stochasticity is studied under:", a: "small population paradigm", opts: ["habitat displacement", "small population paradigm", "reserve design", "biodiversity repository"] },
      { week: 8, num: 7, q: "A population shrinking due to habitat loss, competitors, and poaching is best studied under:", a: "declining population paradigm", opts: ["declining population paradigm", "small population paradigm", "island biogeography model", "cryopreservation strategy"] },
      { week: 8, num: 8, q: "Which of these is a deterministic factor?", a: "death rate", opts: ["environmental variation", "forest fire", "death rate", "diseases"] },
      { week: 8, num: 9, q: "Linear structures like roads and railways contribute to fragmentation because they act as:", a: "mortality sources and physical barriers", opts: ["mortality sources and physical barriers", "seed collection centres", "botanical repositories", "cryopreservation facilities"] },
      { week: 8, num: 10, q: "The acronym HIPPO does not include:", a: "pollination", opts: ["habitat loss", "invasive species", "pollination", "pollution"] },

      // Week 9
      { week: 9, num: 1, q: "A proposed epoch marked by significant human impact on Earth's geology and ecosystems is:", a: "Anthropocene", opts: ["Holocene", "Anthropocene", "Pleistocene", "Carboniferous"] },
      { week: 9, num: 2, q: "According to the Malthusian model:", a: "Population grows in geometric progression, food supply increases in arithmetic progression", opts: ["Population grows in geometric progression, food supply increases in arithmetic progression", "Population grows in geometric progression, food supply increases in geometric progression", "Population grows in arithmetic progression, food supply increases in arithmetic progression", "Population grows in arithmetic progression, food supply increases in geometric progression"] },
      { week: 9, num: 3, q: "Which of these is NOT a primary pillar of sustainability?", a: "trans-boundary sustainability", opts: ["environmental sustainability", "economic sustainability", "trans-boundary sustainability", "social sustainability"] },
      { week: 9, num: 4, q: "The demographic transition sees a society move from:", a: "high birth rate, high death rate to low birth rate, low death rate", opts: ["high birth rate, high death rate to low birth rate, low death rate", "low birth rate, high death rate to low birth rate, low death rate", "high birth rate, low death rate to low birth rate, low death rate", "high birth rate, high death rate to low birth rate, high death rate"] },
      { week: 9, num: 5, q: "Which of the following is listed as a theme of clean technology?", a: "Water purification", opts: ["Water purification", "Predator-prey control", "Migration of birds", "Food chain length"] },
      { week: 9, num: 6, q: "When stalactites and stalagmites join together, they form a:", a: "Column", opts: ["Lagoon", "Crevice", "Terrace", "Column"] },
      { week: 9, num: 7, q: "Which of these is a preventive check according to Malthus?", a: "foresight", opts: ["foresight", "vice", "misery", "flood"] },
      { week: 9, num: 8, q: "Which of these is a recognised pillar of sustainability?", a: "social sustainability", opts: ["social sustainability", "industrial sustainability", "agricultural sustainability", "trans-boundary sustainability"] },
      { week: 9, num: 9, q: "In cave formations, deposits growing downward from the roof are called:", a: "Stalactites", opts: ["Stalagmites", "Columns", "Stalactites", "Sediment bars"] },
      { week: 9, num: 10, q: "Industrial processes such as the Haber process directly affect which biogeochemical cycle?", a: "Nitrogen cycle", opts: ["Carbon cycle only", "Water cycle only", "Nitrogen cycle", "Phosphorus cycle only"] },

      // Week 10
      { week: 10, num: 1, q: "A community already affected by disease, weeds, pollutants, or livestock pressure is best described as:", a: "Disturbed community", opts: ["Pristine community", "Climax community", "Resistant community", "Disturbed community"] },
      { week: 10, num: 2, q: "When an organism absorbs a toxic substance into its tissues faster than it loses it, the process is:", a: "Bioaccumulation", opts: ["Biomagnification", "Bioavailability", "Bioaccumulation", "Biodegradation"] },
      { week: 10, num: 3, q: "What percentage of marine plastic debris is stated to sink to the ocean bottom?", a: "70%", opts: ["15%", "30%", "50%", "70%"] },
      { week: 10, num: 4, q: "Hydrocarbons derived directly from mineral oils are called:", a: "Petrogenic hydrocarbons", opts: ["Pyrogenic hydrocarbons", "Biogenic hydrocarbons", "Aromatic hydrocarbons", "Petrogenic hydrocarbons"] },
      { week: 10, num: 5, q: "\"Any changes that inadvertently increase vulnerability to climatic stimuli rather than reducing it\" is:", a: "maladaptation", opts: ["adaptation", "mitigation", "maladaptation", "malmitigation"] },
      { week: 10, num: 6, q: "A normal community faces one large disturbance and then returns close to its earlier condition. This is:", a: "Recovery", opts: ["Long-term alteration", "Recovery", "Bioaccumulation", "Habitat displacement"] },
      { week: 10, num: 7, q: "Macrodebris in the context of plastic debris has fragments of size:", a: "> 20 mm", opts: ["> 20 mm", "5-20 mm", "< 5 mm", "< 1 mm"] },
      { week: 10, num: 8, q: "The Deepwater Horizon incident is classified by origin as which kind of oil spill?", a: "Accidental", opts: ["Natural", "Accidental", "Intentional", "Biogenic"] },
      { week: 10, num: 9, q: "Harmful effects caused by a single or short-term exposure are called:", a: "Acute toxicity", opts: ["Chronic toxicity", "Acute toxicity", "Sub-lethal exposure", "Bioavailability"] },
      { week: 10, num: 10, q: "Mesodebris in the context of plastic debris has fragments of size:", a: "5-20 mm", opts: ["> 20 mm", "5-20 mm", "< 5 mm", "< 1 mm"] },

      // Week 11
      { week: 11, num: 1, q: "Which term refers to the total weight of organisms removed by fishing?", a: "Yield to fishery", opts: ["Natural mortality", "Recruitment", "Growth", "Yield to fishery"] },
      { week: 11, num: 2, q: "Ludwig's ratchet predicts:", a: "increasing harvesting rate", opts: ["decreasing harvesting rate", "constant harvesting rate", "increasing harvesting rate", "fluctuating harvesting rate"] },
      { week: 11, num: 3, q: "A forest converted to an open mine was later filled with water into a bird sanctuary lake. This is:", a: "replacement", opts: ["recovery", "restoration", "enhancement", "replacement"] },
      { week: 11, num: 4, q: "Which statement about Maximum Sustainable Yield (MSY) is correct?", a: "The maximum sustainable yield is near the mid-point of the sigmoidal curve.", opts: ["The maximum sustainable yield is near the beginning of the sigmoidal curve.", "The maximum sustainable yield is near the mid-point of the sigmoidal curve.", "The maximum sustainable yield is near the end of the sigmoidal curve.", "None of these."] },
      { week: 11, num: 5, q: "Which population balance equation is correct (Recruitment, Growth, Natural Mortality, Fishing)?", a: "R + G = M + F", opts: ["R + G = M + F", "R + M = G + F", "R + F = M + G", "R + G + M + F = 0"] },
      { week: 11, num: 6, q: "In a logistic growth curve, growth is slow near carrying capacity mainly because the population is:", a: "close to the environmental limit", opts: ["very small", "newly introduced", "close to the environmental limit", "free from competition"] },
      { week: 11, num: 7, q: "What does absolute abundance measure?", a: "Actual number of individuals present", opts: ["Relative catch per unit effort", "Actual number of individuals present", "Percentage change in population", "Estimated trend in sightings"] },
      { week: 11, num: 8, q: "A root zone treatment plant is an example of:", a: "phytoremediation", opts: ["phytoremediation", "biological control", "biomagnification", "bioaccumulation"] },
      { week: 11, num: 9, q: "What is a major risk of introducing predators for pest control?", a: "The introduced predator may itself become a pest", opts: ["The pest always becomes extinct immediately", "The predator cannot reproduce under any condition", "The predator reduces rainfall", "The introduced predator may itself become a pest"] },
      { week: 11, num: 10, q: "Ecotoxicology studies toxic chemicals mainly at which broader levels?", a: "Population, community, ecosystem, and biosphere levels", opts: ["Individual atoms and molecules only", "Population, community, ecosystem, and biosphere levels", "Market demand and harvesting cost only", "Crop yield and storage levels only"] },

      // Week 12
      { week: 12, num: 1, q: "In cave formations, the deposits growing downward from the roof are called?", a: "Stalactites", opts: ["Stalagmites", "Columns", "Stalactites", "Sediment bars"] },
      { week: 12, num: 2, q: "Which of these is a deterministic factor?", a: "death rate", opts: ["environmental variation", "forest fire", "death rate", "diseases"] },
      { week: 12, num: 3, q: "An ecological interaction in which both participating organisms are harmed is called:", a: "competition", opts: ["mutualism", "commensalism", "competition", "neutralism"] },
      { week: 12, num: 4, q: "Ecology is the scientific study of ____ that determine the distribution and abundance of organisms.", a: "interactions", opts: ["statics", "interactions", "dynamics", "habitat"] },
      { week: 12, num: 5, q: "Mesodebris in the context of plastic debris has fragments of size:", a: "5-20 mm", opts: ["> 20 mm", "5-20 mm", "< 5 mm", "< 1 mm"] },
      { week: 12, num: 6, q: "Which level is formed when similar cells and their extracellular matrix from the same origin together perform a specific function?", a: "Tissue", opts: ["Organ", "Tissue", "Organ system", "Population"] },
      { week: 12, num: 7, q: "Secondary succession refers to succession that occurs:", a: "After severe disturbance or removal of a pre-existing community", opts: ["On newly exposed rock or sand surfaces", "In a saline body such as a marsh", "After severe disturbance or removal of a pre-existing community", "Only when climate controls the final community"] },
      { week: 12, num: 8, q: "A group of organs working together to perform one or more functions is called?", a: "Organ system", opts: ["Tissue", "Organ", "Organism", "Organ system"] },
      { week: 12, num: 9, q: "After a forest fire, an incompletely destroyed forest develops through stages toward stability. This is:", a: "Secondary succession", opts: ["Secondary succession", "Climatic climax", "Bioaccumulation", "Species-area effect"] },
      { week: 12, num: 10, q: "If organisms already present in an area change the soil conditions and thereby drive further community change, the succession is:", a: "Autogenic succession", opts: ["Allogenic succession", "Autogenic succession", "Catastrophic succession", "Seasonal succession"] }
    ];

    let currentFilteredList = [...assignmentsData];
    let currentFcIndex = 0;
    let isFlipped = false;

    let quizQuestions = [];
    let currentQuizIndex = 0;
    let quizScore = 0;

    const weekFilter = document.getElementById('weekFilter');
    const btnFlashcards = document.getElementById('btnFlashcards');
    const btnQuiz = document.getElementById('btnQuiz');
    const btnBrowse = document.getElementById('btnBrowse');

    const flashcardView = document.getElementById('flashcardView');
    const quizView = document.getElementById('quizView');
    const browseView = document.getElementById('browseView');

    const flipCard = document.getElementById('flipCard');
    const cardInner = document.getElementById('cardInner');
    const fcQuestion = document.getElementById('fcQuestion');
    const fcOptionsList = document.getElementById('fcOptionsList');
    const fcAnswer = document.getElementById('fcAnswer');
    const fcCategory = document.getElementById('fcCategory');
    const fcCardCount = document.getElementById('fcCardCount');
    const fcTag = document.getElementById('fcTag');
    const fcWeekText = document.getElementById('fcWeekText');

    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const btnFlip = document.getElementById('btnFlip');
    const fcShuffle = document.getElementById('fcShuffle');

    const optionLetters = ['(a)', '(b)', '(c)', '(d)'];

    weekFilter.addEventListener('change', () => {
      const selected = weekFilter.value;
      if (selected === 'all') {
        currentFilteredList = [...assignmentsData];
      } else {
        currentFilteredList = assignmentsData.filter(item => item.week === parseInt(selected));
      }
      currentFcIndex = 0;
      updateFlashcard();
      if (!quizView.classList.contains('hidden')) startQuizMode();
      if (!browseView.classList.contains('hidden')) renderBrowseList();
    });

    function setView(view) {
      flashcardView.classList.add('hidden');
      quizView.classList.add('hidden');
      browseView.classList.add('hidden');

      btnFlashcards.className = "px-2.5 py-1 text-xs font-semibold rounded-md text-slate-300 hover:text-white transition";
      btnQuiz.className = "px-2.5 py-1 text-xs font-semibold rounded-md text-slate-300 hover:text-white transition";
      btnBrowse.className = "px-2.5 py-1 text-xs font-semibold rounded-md text-slate-300 hover:text-white transition";

      if (view === 'flashcard') {
        flashcardView.classList.remove('hidden');
        btnFlashcards.className = "px-2.5 py-1 text-xs font-semibold rounded-md bg-emerald-500 text-slate-900 transition";
      } else if (view === 'quiz') {
        quizView.classList.remove('hidden');
        btnQuiz.className = "px-2.5 py-1 text-xs font-semibold rounded-md bg-emerald-500 text-slate-900 transition";
        startQuizMode();
      } else if (view === 'browse') {
        browseView.classList.remove('hidden');
        btnBrowse.className = "px-2.5 py-1 text-xs font-semibold rounded-md bg-emerald-500 text-slate-900 transition";
        renderBrowseList();
      }
    }

    btnFlashcards.addEventListener('click', () => setView('flashcard'));
    btnQuiz.addEventListener('click', () => setView('quiz'));
    btnBrowse.addEventListener('click', () => setView('browse'));

    function flipCurrentCard() {
      isFlipped = !isFlipped;
      if (isFlipped) cardInner.classList.add('rotate-y-180');
      else cardInner.classList.remove('rotate-y-180');
    }

    flipCard.addEventListener('click', flipCurrentCard);
    btnFlip.addEventListener('click', (e) => {
      e.stopPropagation();
      flipCurrentCard();
    });

    function updateFlashcard() {
      if (currentFilteredList.length === 0) return;
      if (isFlipped) {
        cardInner.classList.remove('rotate-y-180');
        isFlipped = false;
      }
      const item = currentFilteredList[currentFcIndex];
      fcQuestion.textContent = item.q;

      fcOptionsList.innerHTML = '';
      item.opts.forEach((opt, idx) => {
        const row = document.createElement('div');
        row.className = "flex items-start gap-2 p-1.5 sm:p-2 rounded-lg bg-slate-900/40 border border-slate-700/60 text-xs sm:text-sm text-slate-300";
        row.innerHTML = `<span class="font-bold text-emerald-400 shrink-0 text-xs">${optionLetters[idx]}</span> <span class="leading-tight">${opt}</span>`;
        fcOptionsList.appendChild(row);
      });

      const correctIdx = item.opts.findIndex(opt => opt.trim().toLowerCase() === item.a.trim().toLowerCase());
      const prefix = correctIdx !== -1 ? `${optionLetters[correctIdx]} ` : '';

      fcAnswer.textContent = `${prefix}${item.a}`;
      fcCategory.textContent = `Week ${item.week} • Q${item.num}`;
      fcCardCount.textContent = `Card ${currentFcIndex + 1} of ${currentFilteredList.length}`;
      fcTag.textContent = `Week ${item.week}`;
      fcWeekText.textContent = `Week ${item.week} - Q${item.num}`;
    }

    btnPrev.addEventListener('click', (e) => {
      e.stopPropagation();
      if (currentFcIndex > 0) {
        currentFcIndex--;
        updateFlashcard();
      }
    });

    btnNext.addEventListener('click', (e) => {
      e.stopPropagation();
      if (currentFcIndex < currentFilteredList.length - 1) {
        currentFcIndex++;
        updateFlashcard();
      }
    });

    fcShuffle.addEventListener('click', () => {
      currentFilteredList.sort(() => Math.random() - 0.5);
      currentFcIndex = 0;
      updateFlashcard();
    });

    document.addEventListener('keydown', (e) => {
      if (!flashcardView.classList.contains('hidden')) {
        if (e.code === 'Space') {
          e.preventDefault();
          flipCurrentCard();
        } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
          if (currentFcIndex < currentFilteredList.length - 1) {
            currentFcIndex++;
            updateFlashcard();
          }
        } else if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
          if (currentFcIndex > 0) {
            currentFcIndex--;
            updateFlashcard();
          }
        }
      }
    });

    function startQuizMode() {
      quizQuestions = [...currentFilteredList].sort(() => Math.random() - 0.5).slice(0, 15);
      currentQuizIndex = 0;
      quizScore = 0;
      loadQuizQuestion();
    }

    function loadQuizQuestion() {
      if (currentQuizIndex >= quizQuestions.length) {
        showQuizResults();
        return;
      }
      const item = quizQuestions[currentQuizIndex];
      document.getElementById('quizProgress').textContent = `Question ${currentQuizIndex + 1} of ${quizQuestions.length} (Week ${item.week})`;
      document.getElementById('quizScoreText').textContent = `Score: ${quizScore} / ${currentQuizIndex}`;
      document.getElementById('quizProgressBar').style.width = `${(currentQuizIndex / quizQuestions.length) * 100}%`;
      document.getElementById('quizQuestion').textContent = item.q;

      const optsContainer = document.getElementById('quizOptions');
      optsContainer.innerHTML = '';
      document.getElementById('quizFeedback').innerHTML = '';
      document.getElementById('quizNextBtn').classList.add('hidden');

      const shuffledOptions = [...item.opts].sort(() => Math.random() - 0.5);
      shuffledOptions.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-3 bg-slate-700/70 hover:bg-slate-700 active:bg-slate-600 border border-slate-600 rounded-xl text-xs sm:text-sm transition font-medium leading-snug";
        btn.textContent = opt;
        btn.onclick = () => handleQuizAnswer(opt, item.a, btn);
        optsContainer.appendChild(btn);
      });
    }

    function handleQuizAnswer(chosen, correct, clickedBtn) {
      const allButtons = document.getElementById('quizOptions').querySelectorAll('button');
      allButtons.forEach(b => {
        b.disabled = true;
        if (b.textContent.trim().toLowerCase() === correct.trim().toLowerCase()) {
          b.className = "w-full text-left p-3 bg-emerald-600/30 border border-emerald-500 rounded-xl text-xs sm:text-sm font-semibold text-emerald-300 leading-snug";
        }
      });

      const feedback = document.getElementById('quizFeedback');
      if (chosen.trim().toLowerCase() === correct.trim().toLowerCase()) {
        quizScore++;
        feedback.innerHTML = `<span class="text-emerald-400"><i class="fa-solid fa-circle-check"></i> Correct!</span>`;
      } else {
        clickedBtn.className = "w-full text-left p-3 bg-rose-600/30 border border-rose-500 rounded-xl text-xs sm:text-sm font-semibold text-rose-300 leading-snug";
        feedback.innerHTML = `<span class="text-rose-400"><i class="fa-solid fa-circle-xmark"></i> Incorrect!</span>`;
      }

      document.getElementById('quizScoreText').textContent = `Score: ${quizScore} / ${currentQuizIndex + 1}`;
      document.getElementById('quizNextBtn').classList.remove('hidden');
    }

    document.getElementById('quizNextBtn').addEventListener('click', () => {
      currentQuizIndex++;
      loadQuizQuestion();
    });

    function showQuizResults() {
      const percentage = Math.round((quizScore / quizQuestions.length) * 100);
      document.getElementById('quizProgressBar').style.width = `100%`;
      document.getElementById('quizQuestion').innerHTML = `Quiz Completed! 🎉`;
      document.getElementById('quizOptions').innerHTML = `
        <div class="text-center py-5 bg-slate-900/60 rounded-xl border border-slate-700">
          <p class="text-3xl font-black text-emerald-400 mb-1">${percentage}%</p>
          <p class="text-slate-300 text-xs sm:text-sm font-medium">You got ${quizScore} out of ${quizQuestions.length} correct.</p>
        </div>
      `;
      document.getElementById('quizFeedback').innerHTML = '';
      const nextBtn = document.getElementById('quizNextBtn');
      nextBtn.textContent = 'Retry Quiz';
      nextBtn.classList.remove('hidden');
      nextBtn.onclick = () => {
        nextBtn.innerHTML = `Next Question <i class="fa-solid fa-chevron-right ml-1"></i>`;
        nextBtn.onclick = () => {
          currentQuizIndex++;
          loadQuizQuestion();
        };
        startQuizMode();
      };
    }

    function renderBrowseList() {
      const container = document.getElementById('browseList');
      const term = document.getElementById('searchInput').value.toLowerCase();
      container.innerHTML = '';

      const filtered = currentFilteredList.filter(item => 
        item.q.toLowerCase().includes(term) || 
        item.a.toLowerCase().includes(term) ||
        `week ${item.week}`.includes(term)
      );

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-slate-500 text-xs">No questions match your search.</div>`;
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-slate-800 border border-slate-700 rounded-xl p-3 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2.5";
        card.innerHTML = `
          <div class="flex-1">
            <div class="flex items-center gap-2 mb-1">
              <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">Week ${item.week}</span>
              <span class="text-[11px] text-slate-500 font-medium">Q${item.num}</span>
            </div>
            <p class="text-xs sm:text-sm font-medium text-slate-200 leading-snug">${item.q}</p>
          </div>
          <div class="bg-slate-900/80 px-3 py-1.5 rounded-lg border border-slate-700 self-stretch sm:self-auto text-left sm:text-right shrink-0">
            <span class="text-[9px] uppercase font-bold text-slate-400 block">Answer</span>
            <span class="text-xs sm:text-sm font-bold text-emerald-400">${item.a}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    document.getElementById('searchInput').addEventListener('input', renderBrowseList);
    updateFlashcard();
  </script>
</body>
</html>
